databases:
  - name: heritage-estates-db
    plan: free

services:
  # ---- Backend: Django REST API ----
  - type: web
    name: heritage-estates-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://heritage-estates.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: heritage-estates-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ---- Frontend: React (Vite) static site ----
  - type: web
    name: heritage-estates-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://heritage-estates-api.onrender.com/api